name: Release On Marker

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: polyrun-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check release marker
        id: marker
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_MARKER: ${{ vars.RELEASE_MARKER }}
          DEFAULT_RELEASE_MARKER: "[release]"
        run: |
          marker="${RELEASE_MARKER:-$DEFAULT_RELEASE_MARKER}"

          if printf '%s' "$COMMIT_MESSAGE" | grep -Fq "$marker"; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "marker=$marker" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "matched=false" >> "$GITHUB_OUTPUT"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "Commit message does not include release marker: $marker"

      - name: Checkout code
        if: steps.marker.outputs.matched == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next version tag
        if: steps.marker.outputs.matched == 'true'
        id: tag
        run: |
          git fetch --tags --force

          existing_tag="$(git tag --points-at HEAD | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -n "$existing_tag" ]]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --sort=-version:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }')"
          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.1.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            next_tag="v${major}.${minor}.$((patch + 1))"
          fi

          git tag "$next_tag"
          git push origin "$next_tag"

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.marker.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
